name: Desplegar

# prod → publica el sitio (Firebase Hosting) y las reglas/índices de Firestore.
# qa   → publica una VISTA PREVIA en el canal "qa" de Hosting (dura 30 días; comparte base de datos con prod).
#
# SECRETO NECESARIO: FIREBASE_SERVICE_ACCOUNT = clave JSON de la cuenta de servicio `github-deploy`
# (roles: Firebase Hosting Admin, Firebase Rules Admin, Cloud Datastore Index Admin y Service Usage Consumer).
# Variable opcional: FIREBASE_PROJECT_ID (si no está, se usa vacacionapp-mdp-d7e72).
on:
  push:
    branches: [prod, qa]

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  calidad:
    uses: ./.github/workflows/ci.yml

  desplegar:
    needs: calidad
    runs-on: ubuntu-latest
    env:
      PROYECTO: ${{ vars.FIREBASE_PROJECT_ID || 'vacacionapp-mdp-d7e72' }}
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Falta el secreto FIREBASE_SERVICE_ACCOUNT
        if: env.SA == ''
        run: echo "::warning::No hay secreto FIREBASE_SERVICE_ACCOUNT: no se publicó nada. Ver docs/INSTRUCTIVO-SETUP.md (sección Despliegue)."
      - uses: actions/checkout@v4
        if: env.SA != ''
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.SA != ''
      - run: npm run build # lee la config pública de .env.production
        if: env.SA != ''
      - name: Credenciales (la clave vive solo en el runner)
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Publicar en producción
        if: env.SA != '' && github.ref == 'refs/heads/prod'
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules,firestore:indexes --project "$PROYECTO" --non-interactive
      - name: Publicar vista previa (qa)
        if: env.SA != '' && github.ref == 'refs/heads/qa'
        run: npx --yes firebase-tools@latest hosting:channel:deploy qa --expires 30d --project "$PROYECTO" --non-interactive
      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
