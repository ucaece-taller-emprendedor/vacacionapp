name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # en main corre el despliegue, que también valida

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Los emuladores de Firebase necesitan Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Tests de reglas de Firestore (emulador)
        run: npm run test:reglas
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests de humo con Playwright (emuladores Auth + Firestore)
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
